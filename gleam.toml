name = "glomp"
version = "0.0.1"
description = "A STOMP 1.1 and 1.2 client for Gleam"
licences = ["MIT"]
repository = { type = "github", user = "trainiac-hq", repo = "glomp" }
target = "erlang"
internal_modules = ["glomp/internal", "glomp/internal/*"]

[erlang]
extra_applications = ["ssl"]

[dependencies]
gleam_stdlib = ">= 1.0.0 and < 2.0.0"
gleam_erlang = ">= 1.3.0 and < 2.0.0"
gleam_otp = ">= 1.2.0 and < 2.0.0"

[dev-dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
